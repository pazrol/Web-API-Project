<!doctype html><html lang="en" data-theme="music"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EvenTix | Register</title><link rel="stylesheet" href="style.css"></head><body><main class="login-shell"><div class="login-card"><p class="eyebrow">EVENTIX · ACCOUNT MANAGEMENT</p><h1>Create an account.</h1><p>Register as an Administrator, Organiser, or Customer.</p><form id="registerForm"><label>Full Name<input name="name" required placeholder="Enter full name"></label><label>Email Address<input type="email" name="email" required placeholder="Enter email address"></label><label>Password<input type="password" name="password" minlength="8" required placeholder="Minimum 8 characters"></label><label>Confirm Password<input type="password" name="confirm_password" minlength="8" required placeholder="Confirm password"></label><label>Account Role<select name="role" required><option value="">Select a role</option><option value="customer">Customer</option><option value="organiser">Organiser</option><option value="admin">Administrator</option></select></label><div id="adminKeyWrap" hidden><label>Administrator Reference Key<input name="reference_key" type="password" placeholder="Provided by system administrator"></label></div><button class="primary-button" type="submit">Create Account</button></form><p id="registerNotice" class="notice" role="alert"></p><p class="center muted">Already have an account? <a href="index.html">Log in here</a></p></div></main><script src="config.js"></script><script src="auth.js"></script></body></html>
